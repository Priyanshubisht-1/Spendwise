<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A clean, professional personal expense tracker.">
    <title>Spendwise — Personal Finance</title>

    <!-- Google Fonts: DM Sans (body text) and Manrope (headings/numbers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- App shell: holds the fixed sidebar and the scrolling main content -->
    <div class="app-shell">

        <!-- ================= SIDEBAR ================= -->
        <aside class="sidebar" id="sidebar">
            <!-- Logo / brand -->
            <a class="brand" href="#" aria-label="Spendwise home">
                <span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 17.5 9.2 12l3.5 3.2L20 7.5" />
                        <path d="M14.8 7.5H20v5.2" />
                    </svg></span>
                <span>Spendwise</span>
            </a>

            <!-- Main navigation links (anchor links that scroll to sections on the page) -->
            <div class="side-label">WORKSPACE</div>
            <nav class="side-nav" aria-label="Main navigation">
                <a class="nav-link active" href="#overview"><span class="nav-icon">▦</span> Overview</a>
                <a class="nav-link" href="#transactions"><span class="nav-icon">↔</span> Transactions</a>
            </nav>

            <!-- Static category legend (coloured dots are styled in CSS) -->
            <div class="image-container"><img src="abc.png" alt=""></div>

            <!-- Bottom of sidebar: motivational card + profile -->
            <div class="sidebar-bottom">
                <div class="upgrade-card">
                    <div class="upgrade-icon">✦</div>
                    <strong>Make every rupee count.</strong>
                    <p>Small steps today, better finances tomorrow.</p>
                </div>
            </div>
        </aside>


        <!-- ================= MAIN CONTENT ================= -->
        <main class="main-content" id="overview"> </main>

    </div>


    <!-- ================= ADD TRANSACTION MODAL ================= -->
    <!-- Hidden by default; shown when the "show" class is added by script.js -->
    <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true"> </div>


    <div class="toast" id="toast" role="status" aria-live="polite"> </div>

    <!-- App logic (loaded last so the DOM elements above already exist) -->
    <script src="script.js"></script>
</body>

</html>
